ng teams and handling every kind of person under pressure.`,`From there, luxury retail floors at Bottega Veneta and Louis Vuitton, managing VIP relationships and consistently exceeding targets.`,`That path led into real estate — first as an agent and today she works both sides of the business: selling directly to clients across the UAE and Egypt, and training the agents who do the same through EMYNAJ.`],quote:`"My purpose is to leave a lasting impact on people's lives — By helping others, my own life improves too."`,quoteAttr:`— Emmy Elnajjar`},gc={kicker:`EMYNAJ Real Estate`,title:`Two markets, one advisor who understands both sides of the deal.`,items:[{name:`UAE`,city:`Dubai`,text:`Direct sales across Dubai, Abu Dhabi and Ras Al Khaimah's off-plan markets, with working relationships across brokerages and developers built over years of active deal-making.`,areas:[`Dubai`,`Abu Dhabi`,`Ras Al Khaimah: Al Marjan Island`]},{name:`Egypt`,city:`Cairo`,text:`Working with clients and investors across New Cairo, the Red Sea and the North Coast, analyzing the market and matching each investor with the opportunity that fits their goal.`,areas:[`New Cairo`,`Red Sea`,`North Coast: Ras El Hekma`]}]},_c={kicker:`EMYNAJ Training`,title:`Two programs for agents who want the room, not just the script.`,programs:[{name:`Agents Accelerator`,tag:`Foundations for building a real estate career`,modules:[{title:`Master the real estate game`,text:`Basic terminology and investment terms, DLD and ADREC rules and regulations, and why the UAE keeps attracting investors.`},{title:`Off-plan sales at its finest`,text:`Off-plan sales leverage and process, key developers and payment plans, area prices and flipping strategy.`},{title:`Build connections to win listings`,text:`Landlord communication and listing generation, secondary sales and leasing process, sales progression and conveyancing.`}]},{name:`Activate Full Potential`,tag:`For agents ready to sell at a higher level`,modules:[{title:`Data
